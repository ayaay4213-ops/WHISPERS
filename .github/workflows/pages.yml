name: Publish WHISPERS Preview

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4
      - name: Extract original app preview
        run: |
          mkdir -p public/app-preview
          unzip -o WHISPERS-Interactive-Preview-02.zip -d extracted
          cp -R extracted/Hamsat-Foundation/. public/app-preview/
      - name: Save extracted app source for safe redesign
        uses: actions/upload-artifact@v4
        with:
          name: whispers-app-source
          path: extracted/Hamsat-Foundation/
          retention-days: 7
      - name: Prepare premium WHISPERS partner landing
        run: |
          cp partner-site/index.html public/index.html
          cp partner-site/styles.css public/styles.css
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
