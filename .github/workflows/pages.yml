name: Publish WHISPERS Preview

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract WHISPERS project
        run: |
          mkdir -p public
          unzip -o WHISPERS-Interactive-Preview-02.zip -d public
          if [ -f public/Hamsat-Foundation/index.html ]; then
            echo "Project extracted successfully"
          else
            echo "Project index.html not found"
            exit 1
          fi

      - name: Make source files editable in repository
        run: |
          cp -a public/Hamsat-Foundation/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html admin.html manifest.json icon.svg icons assets css js workers partner-kit
          if ! git diff --cached --quiet; then
            git commit -m "Add extracted WHISPERS source files"
            git push
          else
            echo "Source files are already up to date"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/Hamsat-Foundation

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
