name: Publish WHISPERS Preview

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4
      - name: Extract original app preview
        run: |
          mkdir -p public/app-preview
          unzip -o WHISPERS-Interactive-Preview-02.zip -d extracted
          cp -R extracted/Hamsat-Foundation/. public/app-preview/
          # Use the exact image uploaded by the owner; keep the original SVG and all screens intact.
          cp assets/file_0000000016d881f4a85b4fbbc4e28f06.png public/app-preview/assets/whispers-user-art.png
          cp login-background.png.jpg public/app-preview/assets/login-background.png.jpg
          # Add a two-second full-screen opening, then reveal the existing app unchanged.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("public/app-preview/index.html")
          s = p.read_text()
          splash = """
          <style>
          /* Keep every app screen completely hidden until the artwork has finished. */
          body:not(.whispers-ready)>:not(#whispers-splash){visibility:hidden!important}
          #whispers-splash{position:fixed;inset:0;width:100vw;height:100dvh;z-index:2147483647;background:#090411;display:flex;align-items:center;justify-content:center;opacity:1}
          #whispers-splash img{display:block;width:100%;height:100%;object-fit:cover;object-position:center}
          </style>
          <div id="whispers-splash" aria-label="Whispers"><img src="assets/whispers-user-art.png" alt="Whispers"></div>
          <script>
          window.setTimeout(function(){
            document.body.classList.add('whispers-ready');
            var s=document.getElementById('whispers-splash');
            if(s){s.remove();}
          },4000);
          </script>
          """
          s = s.replace('<body class="bg-ink-950 text-white font-sans antialiased">', '<body class="bg-ink-950 text-white font-sans antialiased">' + splash, 1)
          # Replace the actual fallback login artwork source (the earlier selector did not match).
          s = s.replace('https://fitfamilyradio.com/images/joomlart/author/1.jpg', 'assets/whispers-user-art.png', 1)
          s = s.replace('src="assets/hamsat-hero.svg" alt="امرأة أنيقة وقط أبيض بزخارف ذهبية" class="auth-art"', 'src="assets/whispers-user-art.png" alt="Whispers" class="auth-art"')
          p.write_text(s)
          css = Path("public/app-preview/css/styles.css")
          c = css.read_text()
          c += """
          /* Owner-approved artwork: softly blurred behind the existing login layout. */
          .auth-page{position:relative;isolation:isolate;overflow:hidden}
          .auth-page:after{content:"";position:absolute;inset:-18px;z-index:-1;background:url("../assets/whispers-user-art.png") center 24%/cover no-repeat;filter:blur(16px);opacity:.24;pointer-events:none}
          .auth-page>*{position:relative;z-index:1}
          """
          # Apply the same artwork as a subtle, softly blurred atmosphere across app screens,
          # while keeping foreground controls and text crisp and readable.
          c += """
          body{position:relative;isolation:isolate}
          body:before{content:"";position:fixed;inset:-22px;z-index:-1;pointer-events:none;background:url("../assets/whispers-user-art.png") center/cover no-repeat;filter:blur(13px);opacity:.13}
          .auth-page:after{filter:blur(14px);opacity:.28}
          .auth-page{background-color:rgba(9,4,17,.18)}
          """
          css.write_text(c)
          PY
          cp css/styles.css public/app-preview/css/styles.css
          cp js/app.js public/app-preview/js/app.js
      - name: Save extracted app source for safe redesign
        uses: actions/upload-artifact@v4
        with:
          name: whispers-app-source
          path: extracted/Hamsat-Foundation/
          retention-days: 7
      - name: Prepare premium WHISPERS partner landing
        run: |
          cp partner-site/index.html public/index.html
          cp partner-site/styles.css public/styles.css
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
